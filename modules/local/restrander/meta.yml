name: restrander
description: Orient and quality-check ONT cDNA reads using Restrander
keywords:
  - orientation
  - restrander
  - ont
  - cDNA
tools:
  - restrander:
      description: |
        Fast program for orienting and quality-checking cDNA sequencing reads.
        Reverse-strand reads are reverse-complemented so all reads share transcript orientation.
      homepage: https://github.com/jakob-schuster/restrander
      documentation: https://github.com/jakob-schuster/restrander-vignette
      licence: ["MIT"]
      identifier: oras://registry-1.docker.io/francops1722/restrander:v1.1.3-sif
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - reads:
        type: file
        description: Input FASTQ file (plain or gzipped)
        pattern: "*.{fastq,fq,fq.gz,fastq.gz}"
  - config:
      - config:
          type: file
          description: Restrander JSON configuration file
          pattern: "*.json"
output:
  - reads:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - "*.restranded.fastq.gz":
          type: file
          description: Reoriented FASTQ with all reads in transcript orientation
          pattern: "*.restranded.fastq.gz"
  - stats:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - "*.stats.json":
          type: file
          description: Restrander statistics written to stdout (totalReads, strandStats, artefactStats)
          pattern: "*.stats.json"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@francoaps"
maintainers:
  - "@francoaps"
